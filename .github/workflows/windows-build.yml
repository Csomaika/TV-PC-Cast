name: Build Windows EXE and Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Run HTTP and PIN tests
        run: python -m pytest -q

      - name: Compile portable Windows EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name TVPCCast --add-data "web;web" --collect-submodules mss tvpc_cast.py

      - name: Compile Windows Setup with Inno Setup
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 compiler not found"
          }
          & $compiler "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: TVPCCast-Windows
          path: |
            dist/TVPCCast.exe
            dist/TVPCCast-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TVPCCast.exe
            dist/TVPCCast-Setup.exe
          generate_release_notes: true
