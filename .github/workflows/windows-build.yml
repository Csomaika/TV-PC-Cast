name: Build and test Windows packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser viewer tests
        run: node --test tests/viewer.test.cjs

      - name: Install the Inno Setup compiler
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $expectedSha256 = 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C'
          Invoke-WebRequest -Uri $url -OutFile $setup
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash -ne $expectedSha256) {
            throw 'Inno Setup download failed SHA-256 verification'
          }
          $arguments = @('/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $destination + '"'))
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $destination 'ISCC.exe'))) {
            throw "Inno Setup compiler installation failed ($($process.ExitCode))"
          }

      - name: Build Windows setup and portable ZIP
        shell: pwsh
        run: |
          $build = @{ InnoCompiler = (Join-Path $env:RUNNER_TEMP 'Inno Setup 6/ISCC.exe') }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $build.Version = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./scripts/build-windows.ps1 @build

      - name: Launch the portable app, install, launch and uninstall
        run: ./scripts/test-windows-install.ps1

      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVPCCast-Windows-Test-Reports
          path: |
            dist/windows-smoke/**/*.json
            dist/windows-smoke/**/*.log
          if-no-files-found: ignore

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: TVPCCast-Windows
          path: |
            dist/TVPCCast-Setup.exe
            dist/TVPCCast-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@v4
        with:
          name: TVPCCast-Windows
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TVPCCast-Setup.exe
            release/TVPCCast-Portable.zip
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
