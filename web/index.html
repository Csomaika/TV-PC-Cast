<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TV-PC Cast | Hisense TV</title>
<style>
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; background:#060a12; color:#ecf6ff; font:18px Arial,sans-serif; }
button,input { font:inherit; }
#pairing { max-width:650px; margin:8vh auto 0; padding:30px; text-align:center; }
h1 { font-size:35px; margin:0 0 10px; color:#87ddff; }
p { color:#b9cce3; line-height:1.5; }
input { width:250px; max-width:95%; font-size:32px; text-align:center; letter-spacing:8px;
  padding:13px; background:#19283d; color:white; border:2px solid #54738e; border-radius:10px; }
button { padding:15px 22px; border:0; border-radius:10px; background:#80d4ff; color:#061421;
 font-weight:bold; cursor:pointer; margin:14px 5px; }
button:focus,input:focus { outline:4px solid #fff; }
#error { color:#ff9f9f; min-height:27px; }
#viewer { display:none; position:absolute; left:0; top:0; width:100%; height:100%; background:#000; }
#screen { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
#controls { position:absolute; bottom:0; left:0; right:0; text-align:center;
  padding:12px; background:rgba(6,10,18,.80); }
#controls span { color:#e4f2ff; padding:6px; }
#controls button { margin:4px; padding:10px 15px; font-size:15px; }
#hint { font-size:15px; }
</style>
</head>
<body>
<div id="pairing">
  <h1>▣ TV-PC Cast</h1>
  <p>Hisense TV képernyőtükrözés</p>
  <p>Írd be a Windows alkalmazásban látható 6 jegyű PIN-kódot.</p>
  <form id="pair-form">
    <input id="pin" type="tel" pattern="[0-9]{6}" maxlength="6"
           inputmode="numeric" autocomplete="off" placeholder="000000" autofocus>
    <div><button id="connect" type="submit">Csatlakozás →</button></div>
  </form>
  <p id="error"></p>
  <p id="hint">A PC és a televízió ugyanahhoz a Wi-Fi/LAN hálózathoz csatlakozzon.</p>
</div>
<div id="viewer">
  <img id="screen" alt="A Windows PC élő képe">
  <div id="controls">
    <span id="mode">Csatlakozás...</span>
    <button type="button" id="compat">Kompatibilitási mód</button>
    <button type="button" id="fullscreen">Teljes képernyő</button>
  </div>
</div>
<script>
(function () {
  "use strict";
  var token = "";
  var mode = "";
  var counter = 0;
  var screen = document.getElementById("screen");
  var message = document.getElementById("error");
  var status = document.getElementById("mode");
  var pairing = document.getElementById("pairing");
  var viewer = document.getElementById("viewer");

  function beginPolling() {
    if (mode === "poll") return;
    mode = "poll";
    status.innerHTML = "JPEG kompatibilitási mód";
    screen.onload = function () {
      if (mode === "poll") window.setTimeout(nextImage, 100);
    };
    screen.onerror = function () {
      if (mode === "poll") window.setTimeout(nextImage, 800);
    };
    nextImage();
  }

  function nextImage() {
    if (mode !== "poll") return;
    screen.src = "/frame?token=" + encodeURIComponent(token) + "&n=" + (++counter);
  }

  function view() {
    pairing.style.display = "none";
    viewer.style.display = "block";
    mode = "mjpeg";
    status.innerHTML = "Élő közvetítés";
    screen.onload = function () {
      status.innerHTML = "Élő közvetítés";
    };
    screen.onerror = function () { beginPolling(); };
    screen.src = "/stream?token=" + encodeURIComponent(token);
    // Some VIDAA browsers cannot decode multipart JPEG. Fall back automatically.
    window.setTimeout(function () {
      if (mode === "mjpeg" && !screen.complete && screen.naturalWidth === 0) {
        beginPolling();
      }
    }, 3500);
  }

  document.getElementById("pair-form").onsubmit = function (event) {
    if (event && event.preventDefault) event.preventDefault();
    var pin = document.getElementById("pin").value;
    if (!/^[0-9]{6}$/.test(pin)) {
      message.innerHTML = "Pontosan 6 számjegy szükséges.";
      return false;
    }
    message.innerHTML = "Kapcsolódás...";
    var request = new XMLHttpRequest();
    request.open("POST", "/api/pair", true);
    request.setRequestHeader("Content-Type", "application/json");
    request.onreadystatechange = function () {
      if (request.readyState !== 4) return;
      var data = {};
      try { data = JSON.parse(request.responseText); } catch (ignore) {}
      if (request.status === 200 && data.token) {
        token = data.token;
        view();
      } else {
        message.innerHTML = data.error || "Nem sikerült kapcsolódni a PC-hez.";
      }
    };
    request.onerror = function () { message.innerHTML = "Hálózati hiba."; };
    request.send(JSON.stringify({ pin: pin }));
    return false;
  };

  document.getElementById("compat").onclick = beginPolling;
  document.getElementById("fullscreen").onclick = function () {
    var element = document.getElementById("viewer");
    var enter = element.requestFullscreen || element.webkitRequestFullscreen;
    if (enter) enter.call(element);
    document.getElementById("controls").style.display = "none";
  };
  document.onkeydown = function (event) {
    event = event || window.event;
    var key = event.keyCode || event.which;
    if (viewer.style.display === "block" && key === 13) {
      document.getElementById("controls").style.display =
        document.getElementById("controls").style.display === "none" ? "block" : "none";
    }
  };
})();
</script>
</body>
</html>
